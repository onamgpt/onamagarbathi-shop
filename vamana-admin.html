<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vamana &mdash; availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8D5A0;--ink:#1A1208;--smoke:#F7F4EE;--ash:#E8E3D9;--ember:#8B2A0F;--wa-dark:#128C7E;--text-body:#3D3526;--text-muted:#7A6E5A}
body{font-family:'Inter',sans-serif;background:var(--smoke);color:var(--text-body);padding:28px 5vw 64px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--ink);letter-spacing:.06em;margin-bottom:4px}
.note{font-size:.82rem;color:var(--text-muted);margin-bottom:24px;line-height:1.7}
.card{background:#fff;border:1px solid var(--ash);border-radius:4px;padding:22px;margin-bottom:18px}
label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid var(--ash);border-radius:3px;font-size:1rem;background:var(--smoke);font-family:'Inter',sans-serif}
input:focus{outline:none;border-color:var(--gold)}
.btn{font-family:'Cinzel',serif;font-size:.76rem;letter-spacing:.12em;font-weight:600;padding:13px 24px;border:none;border-radius:3px;cursor:pointer;transition:.2s}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-light)}
.btn-ghost{background:#fff;color:var(--text-body);border:1px solid var(--ash)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.status{font-family:'Cinzel',serif;font-size:1.1rem;margin:6px 0 2px}
.status.live{color:var(--wa-dark)}
.status.soon{color:var(--ember)}
.msg{font-size:.85rem;margin-top:12px;min-height:1.2em}
.msg.ok{color:var(--wa-dark)}
.msg.err{color:var(--ember)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px}
td,th{padding:8px 0;border-bottom:1px solid var(--ash);text-align:left}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:500}
.empty{font-size:.85rem;color:var(--text-muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vamana 100g &mdash; availability</h1>
  <p class="note">Controls what the QR on the box shows when someone scans it.
  Switch to <b>In stock</b> only once boxes are actually sellable &mdash; the page
  fails to &ldquo;available shortly&rdquo; if anything goes wrong, never the other way.</p>

  <div class="card">
    <label for="pin">Admin PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
    <div class="btns"><button class="btn btn-ghost" id="loadBtn">Load</button></div>
    <div class="msg" id="pinMsg"></div>
  </div>

  <div class="card" id="panel" style="display:none">
    <label>Current status</label>
    <div class="status" id="cur">&mdash;</div>
    <div class="btns">
      <button class="btn btn-gold" id="setLive">Set: In stock</button>
      <button class="btn btn-ghost" id="setSoon">Set: Available shortly</button>
    </div>
    <div class="msg" id="setMsg"></div>
  </div>

  <div class="card" id="leadsCard" style="display:none">
    <label>Waiting list</label>
    <div id="leads" class="empty">&mdash;</div>
  </div>

  <div class="card" id="scanCard" style="display:none">
    <label>Scans &mdash; last 30 days</label>
    <div id="scans" class="empty">&mdash;</div>
  </div>
</div>

<script>
(function(){
  var PRODUCT = "vamana-100";
  var pinEl = document.getElementById("pin");
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  function show(id, cls, text){
    var e = document.getElementById(id); e.className = "msg " + cls; e.textContent = text;
  }
  function paintStatus(s){
    var e = document.getElementById("cur");
    e.textContent = s === "live" ? "In stock" : "Available shortly";
    e.className = "status " + (s === "live" ? "live" : "soon");
  }

  function loadStatus(){
    return fetch("/.netlify/functions/product-status?id=" + encodeURIComponent(PRODUCT))
      .then(function(r){ return r.json(); })
      .then(function(d){ paintStatus(d && d.status); });
  }

  function loadLeads(pin){
    return fetch("/.netlify/functions/notify-interest?pin=" + encodeURIComponent(pin))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var box = document.getElementById("leads");
        if(!d || !d.ok){ box.textContent = "Could not load."; return; }
        if(!d.count){ box.textContent = "No one waiting yet."; return; }
        var rows = d.leads.slice(0, 100).map(function(l){
          return "<tr><td>" + esc(String(l.t).slice(0,10)) + "</td><td>" + esc(l.contact) + "</td></tr>";
        }).join("");
        box.innerHTML = "<b>" + d.count + " waiting</b><table><tr><th>Date</th><th>Contact</th></tr>" + rows + "</table>";
      });
  }

  function loadScans(pin){
    return fetch("/.netlify/functions/scan-log?pin=" + encodeURIComponent(pin) + "&days=30")
      .then(function(r){ return r.json(); })
      .then(function(d){
        var box = document.getElementById("scans");
        if(!d || !d.ok){ box.textContent = "Could not load."; return; }
        if(!d.total){ box.textContent = "No scans recorded yet."; return; }
        var rows = (d.states || []).slice(0, 15).map(function(s){
          return "<tr><td>" + esc(s[0]) + "</td><td>" + esc(s[1]) + "</td></tr>";
        }).join("");
        box.innerHTML = "<b>" + d.total + " scans</b><table><tr><th>State</th><th>Scans</th></tr>" + rows + "</table>";
      });
  }

  document.getElementById("loadBtn").addEventListener("click", function(){
    var pin = (pinEl.value || "").trim();
    if(!pin){ show("pinMsg","err","Enter the PIN."); return; }
    show("pinMsg","","Loading\u2026");
    // The PIN is validated by asking for PIN-protected data. A wrong PIN
    // returns 401 from the leads endpoint and nothing is revealed.
    fetch("/.netlify/functions/notify-interest?pin=" + encodeURIComponent(pin))
      .then(function(r){
        if(r.status === 401){ show("pinMsg","err","Wrong PIN."); return null; }
        show("pinMsg","ok","Loaded.");
        document.getElementById("panel").style.display = "";
        document.getElementById("leadsCard").style.display = "";
        document.getElementById("scanCard").style.display = "";
        return Promise.all([loadStatus(), loadLeads(pin), loadScans(pin)]);
      })
      .catch(function(){ show("pinMsg","err","Network error."); });
  });

  function setStatus(status){
    var pin = (pinEl.value || "").trim();
    show("setMsg","","Saving\u2026");
    fetch("/.netlify/functions/product-status",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({pin:pin, id:PRODUCT, status:status})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok){ paintStatus(d.status); show("setMsg","ok","Saved. Live on the page within a minute."); }
        else { show("setMsg","err", d && d.error === "pin" ? "Wrong PIN." : "Could not save."); }
      }).catch(function(){ show("setMsg","err","Network error."); });
  }

  document.getElementById("setLive").addEventListener("click", function(){ setStatus("live"); });
  document.getElementById("setSoon").addEventListener("click", function(){ setStatus("coming_soon"); });
})();
</script>
</body>
</html>
