# Netlify configuration — Onam Agarbathi shop

[build]
  publish = "."
  functions = "netlify/functions"
  # Applies any pending SQL in /migrations to Supabase before publishing, so
  # schema changes ship with the code that needs them. No-ops without a token.
  command = "node scripts/migrate.mjs"
  environment = { SECRETS_SCAN_OMIT_KEYS = "RAZORPAY_KEY_ID" }

# Portal routes — must come BEFORE the SPA catch-all, or these paths would be
# swallowed by index.html.
[[redirects]]
  from = "/export"
  to = "/export.html"
  status = 200

[[redirects]]
  from = "/export-admin"
  to = "/export-admin.html"
  status = 200

[[redirects]]
  from = "/order"
  to = "/order.html"
  status = 200

[[redirects]]
  from = "/trade-admin"
  to = "/trade-admin.html"
  status = 200

# SPA / single-page fallback: serve index.html for any unmatched route.
# NOTE: never write a redirect whose `from` starts with /.netlify — that path
# is reserved by Netlify and causes "Invalid /.netlify path in redirect source".
# Functions are reachable at /.netlify/functions/<name> automatically; no rule needed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
