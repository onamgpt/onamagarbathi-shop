<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Export Order Portal — Onam Agarbathi</title>
<style>
  :root{
    --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#faf9f7;
    --gold:#9a6b2f; --gold-soft:#f5efe4; --ok:#166534; --err:#9f1239;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 64px}
  h1{font-size:20px;margin:0;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;
        font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:transparent}
  button{background:var(--ink);color:#fff;border:0;border-radius:7px;padding:12px 20px;
         font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .msg{padding:11px 14px;border-radius:7px;font-size:14px;margin-top:12px;display:none}
  .msg.err{background:#fff1f2;color:var(--err);display:block}
  .msg.ok{background:#f0fdf4;color:var(--ok);display:block}
  /* gate */
  #gate{max-width:380px;margin:12vh auto 0}
  .mark{text-align:center;margin-bottom:26px}
  .mark .n{font-size:26px;letter-spacing:.22em;color:var(--gold);font-weight:600}
  .mark .t{font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:6px}
  /* header */
  .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
       padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  .terms{background:var(--gold-soft);border:1px solid #e8dcc4;border-radius:7px;
         padding:9px 13px;font-size:13px;color:#6b4a1e}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid #f5f5f4;vertical-align:middle}
  th.r,td.r{text-align:right}
  .nm{font-weight:600;font-size:14px}
  .sk{font-size:11px;color:var(--muted);letter-spacing:.04em}
  input.ctn{width:74px;padding:8px;text-align:center;font-weight:600}
  .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
  .foot{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--ink);
        padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
        gap:14px;flex-wrap:wrap;margin:0 -20px -20px;border-radius:0 0 10px 10px}
  .tot{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .tot small{display:block;font-size:11px;font-weight:500;color:var(--muted);
             text-transform:uppercase;letter-spacing:.08em}
  /* proforma */
  .pf{font-size:13px}
  .pf h2{font-size:15px;letter-spacing:.16em;text-align:center;text-transform:uppercase;margin:0 0 18px}
  .pf .hd{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
  .pf table{font-size:12px}
  .pf td,.pf th{padding:6px 7px}
  @media print{ body{background:#fff} .noprint{display:none!important} .card{border:0;padding:0} }
  @media (max-width:640px){
    th.hide,td.hide{display:none}
    .wrap{padding:14px 12px 48px}
  }
</style>
</head>
<body>

<!-- ==================== PIN GATE ==================== -->
<div id="gate" class="wrap">
  <div class="mark">
    <div class="n">ONAM</div>
    <div class="t">Export Order Portal</div>
  </div>
  <div class="card">
    <label for="pin">Access code</label>
    <input id="pin" type="text" inputmode="numeric" autocomplete="off"
           placeholder="Enter your code" maxlength="12">
    <div style="height:14px"></div>
    <button id="enter" style="width:100%">Enter</button>
    <div id="gateMsg" class="msg"></div>
    <p style="font-size:12px;color:var(--muted);margin:16px 0 0;text-align:center">
      Issued to approved importers only.<br>
      Contact customercare@onamagarbathi.com for access.
    </p>
  </div>
</div>

<!-- ==================== CATALOGUE ==================== -->
<div id="app" class="wrap" style="display:none">
  <div class="bar">
    <div>
      <h1 id="bName">—</h1>
      <div class="sub" id="bMeta">—</div>
    </div>
    <div class="terms" id="bTerms">—</div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th class="r hide">Units / ctn</th>
          <th class="r">Rate US$</th>
          <th class="r">Cartons</th>
          <th class="r hide">Units</th>
          <th class="r">Amount</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="foot">
      <div class="tot">
        <small><span id="sumCtn">0</span> cartons · <span id="sumUnit">0</span> units</small>
        US$ <span id="sumAmt">0.00</span>
      </div>
      <button id="place" disabled>Place order</button>
    </div>
  </div>

  <div class="card noprint">
    <label for="notes">Shipping marks or instructions (optional)</label>
    <textarea id="notes" rows="2" placeholder="Container preference, marking, delivery week…"></textarea>
    <div id="appMsg" class="msg"></div>
  </div>

  <p class="sub noprint" style="text-align:center">
    Rates are per unit, <span id="ftIncoterm">C&amp;F</span>. Prices firm for 30 days.
    <a href="#" id="signout" style="color:var(--muted)">Sign out</a>
  </p>
</div>

<!-- ==================== PROFORMA ==================== -->
<div id="pfWrap" class="wrap" style="display:none">
  <div class="card pf" id="pf"></div>
  <div class="noprint" style="display:flex;gap:10px;justify-content:center">
    <button onclick="window.print()">Print / Save PDF</button>
    <button class="ghost" id="backBtn">Back to catalogue</button>
  </div>
</div>

<script>
const API = "/.netlify/functions/export-api";
let PIN = "", BUYER = null, PRODUCTS = [];

const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function say(el, text, kind){
  const m = $(el);
  m.textContent = text;
  m.className = "msg " + (kind || "");
  if(!text) m.className = "msg";
}

async function api(payload){
  const r = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
  const d = await r.json().catch(()=>({error:"Server did not respond properly"}));
  if(!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

/* ---------- sign in ---------- */
async function enter(){
  const pin = $("pin").value.trim();
  if(!pin) return;
  $("enter").disabled = true; say("gateMsg","");
  try{
    const d = await api({action:"login", pin});
    PIN = pin; BUYER = d.buyer; PRODUCTS = d.products || [];
    sessionStorage.setItem("onx_pin", pin);
    render();
  }catch(e){
    say("gateMsg", e.message, "err");
  }finally{
    $("enter").disabled = false;
  }
}
$("enter").onclick = enter;
$("pin").addEventListener("keydown", e => { if(e.key === "Enter") enter(); });

/* ---------- catalogue ---------- */
function termsLine(){
  if(BUYER.terms === "advance")  return "Payment terms: 100% in advance with order";
  if(BUYER.terms === "deposit")  return "Payment terms: " + BUYER.deposit_pct + "% with order, balance on arrival";
  return "Payment terms: payable on arrival of shipment";
}

function render(){
  $("gate").style.display = "none";
  $("app").style.display = "";
  $("bName").textContent = BUYER.name;
  $("bMeta").textContent = [BUYER.country, BUYER.incoterm + (BUYER.port ? " " + BUYER.port : "")]
                            .filter(Boolean).join("  ·  ");
  $("bTerms").textContent = termsLine();
  $("ftIncoterm").textContent = BUYER.incoterm + (BUYER.port ? " " + BUYER.port : "");

  $("rows").innerHTML = PRODUCTS.map(p => `
    <tr data-sku="${p.sku}">
      <td><div class="nm">${p.name}</div><div class="sk">${p.sku} · MOQ ${p.moq_cartons}</div></td>
      <td class="r hide">${p.units_per_carton}</td>
      <td class="r amt">${Number(p.rate_per_unit).toFixed(2)}</td>
      <td class="r"><input class="ctn" type="number" min="0" step="1" value="" placeholder="0"
            data-rate="${p.rate_per_unit}" data-upc="${p.units_per_carton}" data-moq="${p.moq_cartons}"></td>
      <td class="r amt hide" data-units>0</td>
      <td class="r amt" data-amount>0.00</td>
    </tr>`).join("");

  $("rows").addEventListener("input", recalc);
  recalc();
}

function recalc(){
  let ctns = 0, units = 0, amt = 0, any = false;
  $("rows").querySelectorAll("tr").forEach(tr => {
    const inp = tr.querySelector("input.ctn");
    const c = parseInt(inp.value, 10) || 0;
    const u = c * Number(inp.dataset.upc);
    const a = u * Number(inp.dataset.rate);
    tr.querySelector("[data-units]").textContent = u ? u.toLocaleString("en-US") : "0";
    tr.querySelector("[data-amount]").textContent = money(a);
    const moq = Number(inp.dataset.moq) || 1;
    inp.style.borderColor = (c > 0 && c < moq) ? "var(--err)" : "";
    ctns += c; units += u; amt += a;
    if(c > 0) any = true;
  });
  $("sumCtn").textContent = ctns.toLocaleString("en-US");
  $("sumUnit").textContent = units.toLocaleString("en-US");
  $("sumAmt").textContent = money(amt);
  $("place").disabled = !any;
}

/* ---------- place order ---------- */
$("place").onclick = async () => {
  const lines = [];
  $("rows").querySelectorAll("tr").forEach(tr => {
    const c = parseInt(tr.querySelector("input.ctn").value, 10) || 0;
    if(c > 0) lines.push({ sku: tr.dataset.sku, cartons: c });
  });
  if(!lines.length) return;

  $("place").disabled = true; say("appMsg","Placing your order…","ok");
  try{
    const d = await api({ action:"placeOrder", pin: PIN, lines, notes: $("notes").value });
    showProforma(d.order, d.buyer);
  }catch(e){
    say("appMsg", e.message, "err");
    $("place").disabled = false;
  }
};

/* ---------- proforma ---------- */
function showProforma(order, buyer){
  const d = new Date(order.created_at || Date.now());
  const dd = String(d.getDate()).padStart(2,"0") + "." +
             String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();
  const rows = order.lines.map(l => `
    <tr>
      <td class="r">${l.cartons}</td>
      <td class="r">${l.units_per_carton}</td>
      <td>${l.name}</td>
      <td class="r">${l.units.toLocaleString("en-US")}</td>
      <td class="r">${Number(l.rate_per_unit).toFixed(2)}</td>
      <td class="r">${money(l.amount)}</td>
    </tr>`).join("");

  let terms = "Payable on arrival of shipment.";
  if(order.deposit_pct >= 100) terms = "100% advance with order: US$ " + money(order.total_usd) + ".";
  else if(order.deposit_pct > 0)
    terms = order.deposit_pct + "% with order (US$ " + money(order.deposit_usd) +
            "), balance US$ " + money(order.balance_usd) + " on arrival.";

  $("pf").innerHTML = `
    <h2>Proforma Invoice</h2>
    <div class="hd">
      <div>
        <strong>ONAM AGARBATHI PVT. LTD.</strong><br>
        Bangalore, India<br>
        GSTIN: 29AAACO2213Q1Z8
      </div>
      <div style="text-align:right">
        <strong>REF: ${order.order_no}</strong><br>
        DATE: ${dd}
      </div>
    </div>
    <div style="border:1px solid var(--line);border-radius:6px;padding:11px;margin-bottom:16px">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Buyer</div>
      <strong>${buyer.name}</strong><br>${buyer.country || ""}
    </div>
    <table>
      <thead><tr>
        <th class="r">Ctns</th><th class="r">Unit/Ctn</th><th>Particulars</th>
        <th class="r">Units</th><th class="r">Rate US$</th>
        <th class="r">Amount<br>${buyer.incoterm || "C&F"} ${buyer.port || ""}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="border-top:2px solid var(--ink);font-weight:700">
        <td class="r">${order.total_cartons}</td><td></td><td></td>
        <td class="r">${Number(order.total_units).toLocaleString("en-US")}</td>
        <td></td><td class="r">${money(order.total_usd)}</td>
      </tr></tfoot>
    </table>
    <p style="margin-top:16px"><strong>Terms:</strong> ${terms}</p>
    <p style="color:var(--muted);font-size:11px;margin-top:20px">
      This is a proforma invoice and not a tax invoice. Goods for export.
      Commercial invoice follows on shipment.
    </p>`;

  $("app").style.display = "none";
  $("pfWrap").style.display = "";
  window.scrollTo(0,0);
}

$("backBtn").onclick = () => {
  $("pfWrap").style.display = "none";
  $("app").style.display = "";
  $("rows").querySelectorAll("input.ctn").forEach(i => i.value = "");
  $("notes").value = "";
  say("appMsg","");
  recalc();
};

$("signout").onclick = (e) => {
  e.preventDefault();
  sessionStorage.removeItem("onx_pin");
  location.reload();
};

/* ---------- resume session ---------- */
(async function(){
  const saved = sessionStorage.getItem("onx_pin");
  if(!saved) return;
  try{
    const d = await api({action:"login", pin: saved});
    PIN = saved; BUYER = d.buyer; PRODUCTS = d.products || [];
    render();
  }catch(e){
    sessionStorage.removeItem("onx_pin");
  }
})();
</script>
</body>
</html>
