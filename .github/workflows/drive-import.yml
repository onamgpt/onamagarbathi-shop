name: drive-import
on:
  push:
    paths: [ "tools/drive-ids.txt" ]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow requests
      - run: |
          python3 - <<'PY'
          import requests, io, os
          from PIL import Image
          os.makedirs("tools/drive-import/full", exist_ok=True); os.makedirs("tools/drive-import/thumb", exist_ok=True)
          log=[]
          for line in open("tools/drive-ids.txt"):
              p=line.split()
              if len(p)<2: continue
              fid,name=p[0],p[1]
              try:
                  r=requests.get("https://drive.usercontent.google.com/download",params={"id":fid,"export":"download","confirm":"t"},timeout=60)
                  im=Image.open(io.BytesIO(r.content)); im.load()
                  if im.mode in ("RGBA","LA","P"):
                      im=im.convert("RGBA"); bg=Image.new("RGB",im.size,(255,255,255)); bg.paste(im,mask=im.split()[-1]); im=bg
                  else: im=im.convert("RGB")
                  w,h=im.size
                  a=im.copy(); a.thumbnail((640,640)); a.save(f"tools/drive-import/full/{name}.jpg","JPEG",quality=82,optimize=True,progressive=True)
                  b=im.copy(); b.thumbnail((320,320)); b.save(f"tools/drive-import/thumb/{name}.jpg","JPEG",quality=70)
                  log.append(f"ok {name} {w}x{h}")
              except Exception as e:
                  log.append(f"FAIL {name} {e} {r.status_code if 'r' in dir() else ''} {r.headers.get('content-type','') if 'r' in dir() else ''}")
          open("tools/drive-import/log.txt","w").write("\n".join(log)+"\n")
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tools/drive-import && git commit -m "drive import: product photos" && git push || echo nothing
